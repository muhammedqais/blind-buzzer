<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b19">
<title>Blind Buzzer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&display=swap">
<style>
  /* Layout: one-screen stage. Studio blackout: dark indigo set, one hot buzzer red, gold for the winner. */
  :root {
    --bg: #0d0b19;
    --panel: #181430;
    --panel-2: #221c42;
    --line: #322a5c;
    --fg: #f4f0ff;
    --muted: #a39bc4;
    --buzz: #ff3b5c;
    --buzz-hi: #ff8599;
    --buzz-deep: #a30f2c;
    --gold: #ffc43d;
    --ok: #3ddc97;
    --display: "Bungee", "Impact", "Arial Black", sans-serif;
    --body: "Rubik", "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.45;
    display: flex;
    flex-direction: column;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
    overflow-x: hidden;
  }
  * { box-sizing: border-box; }
  button { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  h1 { font-family: var(--display); font-size: 18px; letter-spacing: .04em; color: var(--buzz-hi); }
  h2 { font-family: var(--display); font-size: clamp(22px, 6vw, 34px); line-height: 1.1; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 500; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); font-weight: 500; }
  .num { font-variant-numeric: tabular-nums; }

  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding-block: 12px 8px;
    border-bottom: 1px solid var(--line);
  }
  #conn { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #conn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  #conn.on::before { background: var(--ok); }

  main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding-block: 16px; gap: 16px; }
  #err { background: #3a1222; border: 1px solid var(--buzz-deep); color: #ffd3da; padding: 10px 12px; border-radius: 8px; font-size: 14px; }

  .btn {
    border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px;
    padding: 12px 18px; font-weight: 500; cursor: pointer; min-height: 48px;
  }
  .btn:hover { border-color: var(--muted); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--buzz); border-color: var(--buzz); color: #fff; font-family: var(--display); letter-spacing: .03em; }
  .btn.gold { background: var(--gold); border-color: var(--gold); color: #2a1d00; font-family: var(--display); letter-spacing: .03em; }
  .btn.big { font-size: 20px; min-height: 64px; flex: 1; }
  .btn.sm { padding: 6px 12px; min-height: 36px; font-size: 14px; }
  .link { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 8px; align-self: center; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > .btn { flex: 1; }

  .col { display: flex; flex-direction: column; gap: 14px; max-width: 480px; width: 100%; margin: 0 auto; }
  .lede { font-size: 17px; max-width: 34em; }
  .choices { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 560px) { .choices { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); } }
  .choice {
    text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; min-height: 120px;
  }
  .choice:hover:not(:disabled) { border-color: var(--buzz); }
  .choice:disabled { opacity: .55; cursor: default; }
  .choice-t { font-family: var(--display); font-size: 20px; color: var(--buzz-hi); }
  .choice-d { color: var(--muted); font-size: 14px; }
  .hint { color: var(--muted); font-size: 14px; }

  label { font-size: 13px; color: var(--muted); }
  input[type="text"] {
    width: 100%; padding: 14px; font-size: 18px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--fg); min-width: 0;
  }
  input.code { font-family: var(--display); letter-spacing: .3em; text-transform: uppercase; text-align: center; font-size: 24px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper .val { font-family: var(--display); font-size: 26px; min-width: 2.2ch; text-align: center; }
  .stepper .lbl { flex: 1; }
  .names { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .names input { padding: 10px; font-size: 15px; }

  /* Stage */
  .play { display: flex; flex-direction: column; gap: 18px; flex: 1; min-height: 0; }
  .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
  .target { font-family: var(--display); font-size: clamp(40px, 14vw, 88px); font-variant-numeric: tabular-nums; line-height: 1; color: var(--gold); }
  .target small { font-size: .35em; color: var(--muted); font-family: var(--body); font-weight: 500; letter-spacing: .1em; margin-left: 6px; }
  .buzzer {
    width: min(68vw, 280px); aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 0; cursor: pointer;
    font-family: var(--display); font-size: clamp(28px, 8vw, 46px); color: #fff; letter-spacing: .04em;
    background: radial-gradient(circle at 36% 30%, var(--buzz-hi), var(--buzz) 52%, var(--buzz-deep));
    box-shadow: 0 16px 0 var(--buzz-deep), 0 28px 44px rgba(0,0,0,.6), inset 0 -6px 12px rgba(0,0,0,.25);
    transition: transform .07s, box-shadow .07s;
    touch-action: manipulation; user-select: none; -webkit-user-select: none; position: relative;
  }
  .buzzer:active { transform: translateY(12px); box-shadow: 0 4px 0 var(--buzz-deep), 0 10px 20px rgba(0,0,0,.6), inset 0 -6px 12px rgba(0,0,0,.25); }
  .buzzer.running { background: radial-gradient(circle at 36% 30%, #5b6cff, #2f3bb8 52%, #171d63); box-shadow: 0 16px 0 #10154a, 0 28px 44px rgba(0,0,0,.6), inset 0 -6px 12px rgba(0,0,0,.25); }
  .buzzer.running:active { box-shadow: 0 4px 0 #10154a, 0 10px 20px rgba(0,0,0,.6), inset 0 -6px 12px rgba(0,0,0,.25); }
  .buzzer.sealed { font-size: clamp(22px, 6.5vw, 38px); background: radial-gradient(circle at 36% 30%, #ffd98a, var(--gold) 52%, #b8800a); box-shadow: 0 4px 0 #8a5f00, 0 10px 20px rgba(0,0,0,.6); color: #2a1d00; transform: translateY(12px); cursor: default; }
  @media (prefers-reduced-motion: reduce) { .buzzer { transition: none; } }

  /* Dial: six stops, 10s to 60s */
  .dial { display: flex; flex-direction: column; gap: 8px; }
  .dial-track { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
  .dial-track.n3 { grid-template-columns: repeat(3, 1fr); }
  .dial-stop { border: 0; background: transparent; border-radius: 999px; padding: 10px 2px; font-family: var(--display); font-size: 13px; line-height: 1.1; color: var(--muted); cursor: pointer; min-width: 0; }
  .dial-stop[aria-pressed="true"] { background: var(--gold); color: #2a1d00; }
  .dial-stop:hover:not([aria-pressed="true"]) { color: var(--fg); }

  .turn-name { font-family: var(--display); font-size: clamp(34px, 11vw, 64px); line-height: 1; color: var(--gold); overflow-wrap: anywhere; }
  .btn.ready { display: flex; flex-direction: column; align-items: center; gap: 2px; line-height: 1.1; }
  .btn.ready small { font-family: var(--body); font-size: 14px; font-weight: 500; letter-spacing: 0; text-transform: none; opacity: .9; }

  .winner { font-family: var(--display); font-size: clamp(24px, 7vw, 40px); color: var(--gold); line-height: 1.1; overflow-wrap: anywhere; }
  .codebig { font-family: var(--display); font-size: clamp(40px, 14vw, 72px); letter-spacing: .18em; color: var(--buzz-hi); line-height: 1; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; width: 100%; text-align: left; }
  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .list li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; background: var(--panel-2); min-width: 0; }
  .list li.me { outline: 1px solid var(--gold); }
  .list li.first { background: #3a2c05; }
  .rank { font-family: var(--display); color: var(--gold); min-width: 2ch; font-size: 15px; }
  .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .tag { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); white-space: nowrap; }
  .tag.ok { color: var(--ok); }
  .score { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 2.5ch; text-align: right; white-space: nowrap; }
  .diff { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; font-size: 14px; }
  .diff.best { color: var(--gold); font-weight: 700; }
  .rooms li { cursor: pointer; }
  .rooms li:hover { outline: 1px solid var(--muted); }

  .pill { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; padding: 5px 10px; border-radius: 999px; font-weight: 700; background: var(--panel-2); color: var(--muted); }
  .pill.live { background: var(--buzz); color: #fff; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  details summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  details p { font-size: 14px; color: var(--muted); margin-top: 8px; }
</style>

<body>
<header>
  <h1>Blind Buzzer</h1>
  <span id="conn">Checking…</span>
</header>
<main id="screen"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>if (typeof window.Peer !== 'function') { document.write('<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"><\/script>'); }</script>
<script>
(function () {
  'use strict';

  var MIN_TARGET = 0.05;
  var DIAL_STOPS = [10, 20, 30, 40, 50, 60];
  function snapDial(v) { return DIAL_STOPS.indexOf(v) === -1 ? 20 : v; }
  var app = {
    screen: 'home', db: null, user: null, me: null, dbReady: false, nick: '', err: '', busy: '',
    code: null, room: null, players: {}, results: {}, unsubs: [], stage: null, run: { on: false, t0: 0 },
    openRooms: [], openUnsub: null, wroteStart: false,
    create: { rounds: 5, size: 2, maxSec: 20, style: 'mixed' }, joinCode: '',
    local: null, lsetup: { n: 2, names: [], rounds: 5, maxSec: 20, style: 'mixed' }
  };

  var root = document.getElementById('screen');
  var connEl = document.getElementById('conn');

  // ---------- DOM helper (text only, never HTML from data) ----------
  function h(tag, attrs) {
    var el = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'style') el.setAttribute('style', v);
      else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), v);
      else if (k === 'value') el.value = v;
      else el.setAttribute(k, v === true ? '' : v);
    });
    for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }
  function append(el, kid) {
    if (kid === null || kid === undefined || kid === false) return;
    if (Array.isArray(kid)) { kid.forEach(function (k) { append(el, k); }); return; }
    el.appendChild(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }

  // ---------- sound ----------
  var ac = null;
  function tone(freq, dur, type, vol) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = type || 'square'; o.frequency.value = freq;
      g.gain.value = vol || 0.15;
      o.connect(g); g.connect(ac.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
      o.stop(ac.currentTime + dur);
    } catch (e) { /* no audio here */ }
  }
  var sfx = {
    unlock: function () { tone(1, 0.01, 'sine', 0.0001); },
    start: function () { tone(660, 0.1, 'square', 0.12); },
    stop: function () { tone(330, 0.18, 'square', 0.14); },
    reveal: function () { [523, 659, 784, 1046].forEach(function (f, i) { setTimeout(function () { tone(f, 0.22, 'triangle', 0.16); }, i * 90); }); }
  };

  // ---------- game math ----------
  function fmt(ms) { return (ms / 1000).toFixed(2) + 's'; }
  function fmtDiff(ms, targetMs) {
    var d = ms - targetMs;
    return (d >= 0 ? '+' : '−') + (Math.abs(d) / 1000).toFixed(2) + 's';
  }
  function randCode() {
    var a = 'ABCDEFGHJKLMNPQRSTUVWXYZ', s = '';
    for (var i = 0; i < 4; i++) s += a[Math.floor(Math.random() * a.length)];
    return s;
  }
  // Targets to two decimals, from 0.05s up to the dial, never the same twice in one game.
  // Target styles: 'whole' = whole seconds from 1 to the dial; 'fraction' = under a second, 0.05 to 0.99;
  // 'mixed' = two thirds whole, one third fractions. Never the same target twice in one game.
  var STYLES = [['whole', 'Whole seconds'], ['fraction', 'Fractions'], ['mixed', 'Mixed']];
  function snapStyle(v) { return v === 'whole' || v === 'fraction' ? v : 'mixed'; }
  function styleName(v) { v = snapStyle(v); return v === 'whole' ? 'whole seconds' : v === 'fraction' ? 'fractions of a second' : 'mixed targets'; }
  function genTargets(n, maxSec, style) {
    style = snapStyle(style);
    var t = [], used = {}, whole = Math.max(1, Math.floor(maxSec));
    for (var i = 0; i < n; i++) {
      var v, tries = 0;
      do {
        var frac = style === 'fraction' || (style === 'mixed' && Math.random() < 1 / 3);
        if (frac) v = Math.round(5 + Math.random() * 95) / 100;
        else v = 1 + Math.floor(Math.random() * whole);
        tries++;
      } while (used[v] && tries < 100);
      used[v] = true; t.push(v);
    }
    return t;
  }
  function fmtT(s) { s = Number(s); return s === Math.round(s) ? String(s) : s.toFixed(2); }
  function winners(times, targetMs) {
    var best = Infinity, w = [];
    Object.keys(times).forEach(function (id) {
      var d = Math.abs(times[id] - targetMs);
      if (d < best - 0.001) { best = d; w = [id]; }
      else if (Math.abs(d - best) <= 0.001) w.push(id);
    });
    return w;
  }
  function tally(ids, rounds, targets, timesFor) {
    var pts = {}, dev = {};
    ids.forEach(function (id) { pts[id] = 0; dev[id] = 0; });
    for (var k = 1; k <= rounds; k++) {
      var t = timesFor(k);
      if (!t) continue;
      winners(t, targets[k - 1] * 1000).forEach(function (id) { pts[id]++; });
      ids.forEach(function (id) { if (t[id] !== undefined) dev[id] += Math.abs(t[id] - targets[k - 1] * 1000); });
    }
    return { pts: pts, dev: dev };
  }

  // ---------- capabilities ----------
  function useCap(name) {
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        return window.claude.use(name).catch(function () { return null; });
      }
    } catch (e) { /* fall through */ }
    return Promise.resolve(null);
  }

  function boot(restored) {
    try { app.nick = localStorage.getItem('bb-nick') || ''; } catch (e) { /* storage blocked */ }
    if (restored) {
      if (restored.nick) app.nick = restored.nick;
      if (restored.local) { app.local = restored.local; app.screen = 'localPlay'; }
    }
    if (!app.local) {
      var savedLocal = lsGet('bb-local');
      if (savedLocal && savedLocal.local) { app.local = savedLocal.local; if (app.local.step === 'running') app.local.step = 'ready'; app.screen = 'localPlay'; }
      if (restored.lsetup) app.lsetup = restored.lsetup;
      if (restored.create) app.create = restored.create;
    }
    app.lsetup.maxSec = snapDial(app.lsetup.maxSec); app.lsetup.style = snapStyle(app.lsetup.style);
    app.create.maxSec = snapDial(app.create.maxSec); app.create.style = snapStyle(app.create.style);
    render();
    Promise.all([useCap('db'), useCap('user')]).then(function (caps) {
      app.db = caps[0]; app.user = caps[1];
      if (app.user) return app.user.id().then(function (id) { app.me = id; }).catch(function () {});
    }).then(function () {
      app.dbReady = true;
      if (app.screen !== 'localPlay') resumeSession();
      render();
    });
  }

  function write(fn) {
    return fn().then(function () { app.err = ''; }).catch(function (e) {
      var code = (e && e.code) || 'unavailable';
      if (code === 'unavailable') {
        return new Promise(function (res) { setTimeout(res, 300 + Math.random() * 400); })
          .then(fn).then(function () { app.err = ''; }).catch(function (e2) { fail((e2 && e2.code) || 'unavailable'); });
      }
      fail(code);
    }).then(render);
  }
  function fail(code) {
    if (code === 'invalid_argument') app.err = 'This page will not save your play. Ask whoever shared it to give you edit access, then reload.';
    else if (code === 'quota_exceeded') app.err = 'The game store is full. Start a fresh page.';
    else app.err = 'Could not reach the room (' + code + '). Try again.';
  }
  function myName() {
    var n = (app.nick || '').trim().slice(0, 20) || 'Player';
    app.nick = n;
    try { localStorage.setItem('bb-nick', n); } catch (e) { /* ignore */ }
    return n;
  }
  // What survives a reload: which room you were in (and, for a host, the whole room).
  var SESSION_TTL = 6 * 3600 * 1000;
  function lsGet(k) { try { var v = JSON.parse(localStorage.getItem(k) || 'null'); return v && (Date.now() - (v.savedAt || 0)) < SESSION_TTL ? v : null; } catch (e) { return null; } }
  function lsSet(k, v) { try { if (v) localStorage.setItem(k, JSON.stringify(Object.assign({ savedAt: Date.now() }, v))); else localStorage.removeItem(k); } catch (e) { /* ignore */ } }
  function saveHostState() { if (net.mode === 'peer' && peerNet.isHost && app.room) lsSet('bb-host', { room: app.room, players: app.players, results: app.results }); }
  function resumeSession() {
    var s = lsGet('bb-session'); if (!s || !s.code) return;
    var mode = netMode();
    if (s.nick) app.nick = s.nick;
    if (s.mode === 'db') { if (mode === 'db') { dbNet.watch(s.code); app.gameSeen = -1; app.screen = 'room'; } return; }
    if (mode !== 'peer') return;
    if (s.mode === 'peer-host') {
      var saved = lsGet('bb-host');
      if (!saved || !saved.room) { lsSet('bb-session', null); return; }
      app.screen = 'online'; app.busy = 'Reopening room ' + s.code + '…'; render();
      peerNet.resume(s.code, saved).then(function () { app.busy = ''; enterRoom(s.code); }, function (e) { app.busy = ''; lsSet('bb-session', null); lsSet('bb-host', null); netFail(e); });
    } else if (s.mode === 'peer-client') {
      app.screen = 'online'; app.busy = 'Rejoining room ' + s.code + '…'; render();
      peerNet.join(s.code, myName()).then(function () { app.busy = ''; enterRoom(s.code); }, function (e) { app.busy = ''; lsSet('bb-session', null); netFail(e); });
    }
  }

  // ---------- online rooms: two transports behind one interface ----------
  // 'db'   : the shared database this page gets when it runs inside claude.ai
  // 'peer' : browser to browser over WebRTC (PeerJS). The room creator's tab is the server.
  function inClaudeViewer() { try { return !!(window.claude && typeof window.claude.use === 'function'); } catch (e) { return false; } }
  function netMode() {
    if (!app.dbReady) return null;
    if (app.db && app.me) return 'db';
    if (!inClaudeViewer() && typeof window.Peer === 'function') return 'peer';
    return null;
  }
  var net = { mode: null };

  function createRoom() {
    sfx.unlock();
    var c = app.create, name = myName(), mode = netMode();
    if (!mode) return;
    var doc = { code: '', rounds: c.rounds, size: c.size, maxSec: c.maxSec, targets: genTargets(c.rounds, c.maxSec, c.style), style: c.style,
      status: 'open', createdAt: Date.now(), hostId: '', dropped: [] };
    app.err = ''; app.busy = 'Creating room…'; render();
    var p = mode === 'db' ? dbNet.create(doc, name) : peerNet.create(doc, name);
    p.then(function (code) { app.busy = ''; enterRoom(code); }, function (e) { app.busy = ''; netFail(e); });
  }
  function joinRoom(code) {
    sfx.unlock();
    code = (code || '').trim().toUpperCase();
    if (code.length !== 4) { app.err = 'Room codes are 4 letters.'; render(); return; }
    var name = myName(), mode = netMode();
    if (!mode) return;
    app.err = ''; app.busy = 'Joining ' + code + '…'; render();
    var p = mode === 'db' ? dbNet.join(code, name) : peerNet.join(code, name);
    p.then(function () { app.busy = ''; enterRoom(code); }, function (e) { app.busy = ''; netFail(e); });

      var last = k >= L.rounds, times = localTimes(k), w = winners(times, target * 1000), S = localStandings();
      body = h('div', { class: 'stage' },
        h('p', { class: 'eyebrow' }, 'Round ' + k + ' of ' + L.rounds + ' · revealed'),
        h('p', { class: 'winner' }, w.length === 1 ? localName(w[0]) + ' takes it' : 'Dead heat'),
        roundResults(k, times, target, localName, null),
        h('div', { class: 'panel' }, h('h3', {}, 'Standings'), h('ol', { class: 'list' }, S.ids.map(function (id, i) {
          return h('li', {}, h('span', { class: 'rank' }, String(i + 1)), h('span', { class: 'name' }, localName(id)),
            h('span', { class: 'diff' }, 'off by ' + fmt(S.dev[id]) + ' total'), h('span', { class: 'score' }, S.pts[id] + (S.pts[id] === 1 ? ' pt' : ' pts')));
        }))),
        h('button', { class: 'btn ' + (last ? 'gold' : 'primary') + ' big', style: 'width:100%', onclick: function () {
          if (last) L.step = 'final'; else { L.round++; L.turn = 0; L.step = 'pass'; }
          render();
        } }, last ? 'Final standings' : 'Round ' + (k + 1)));
    } else {
      var F = localStandings(), champ = F.ids[0];
      var tiedL = F.ids.filter(function (id) { return F.pts[id] === F.pts[champ] && F.dev[id] === F.dev[champ]; });
      body = h('div', { class: 'stage' },
        h('p', { class: 'eyebrow' }, 'Game over · ' + L.rounds + (L.rounds === 1 ? ' round' : ' rounds')),
        h('p', { class: 'winner' }, tiedL.length > 1 ? 'Shared crown' : localName(champ) + ' wins'),
        h('div', { class: 'panel' }, h('h3', {}, 'Final standings'), h('ol', { class: 'list' }, F.ids.map(function (id, i) {
          return h('li', { class: i === 0 ? 'first' : '' }, h('span', { class: 'rank' }, String(i + 1)), h('span', { class: 'name' }, localName(id)),
            h('span', { class: 'diff' }, 'off by ' + fmt(F.dev[id]) + ' total'), h('span', { class: 'score' }, F.pts[id] + (F.pts[id] === 1 ? ' pt' : ' pts')));
        }))),
        h('details', { style: 'width:100%' }, h('summary', {}, 'Every round'),
          (function () { var out = []; for (var r = 1; r <= L.rounds; r++) out.push(roundResults(r, localTimes(r) || {}, L.targets[r - 1], localName, null)); return out; })()),
        h('button', { class: 'btn primary big', style: 'width:100%', onclick: function () { app.local = null; app.screen = 'localSetup'; render(); } }, 'Play again'));
    }
    return h('section', { class: 'play' }, body,
      h('button', { class: 'link', onclick: function () { app.lsetup.solo = !!L.solo; app.local = null; app.run = { on: false, t0: 0 }; app.screen = 'localSetup'; render(); } }, 'Quit game'));
  };

  // ---------- start (survives live republishes where the viewer supports it) ----------
  try {
    var hot = window.claude && window.claude.hot;
    if (hot && typeof hot.snapshot === 'function') {
      hot.snapshot(function () { return { nick: app.nick, code: app.code, stage: app.stage, local: app.local, lsetup: app.lsetup, create: app.create }; });
    }
    if (hot && typeof hot.ready === 'function') hot.ready(boot);
    else boot((hot && hot.data) || {});
  } catch (e) { boot({}); }
})();
</script>
</body>
</html>
